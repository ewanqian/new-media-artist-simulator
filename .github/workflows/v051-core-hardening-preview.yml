name: v0.5.1 Core Hardening Preview

on:
  push:
    branches:
      - v05.1/core-hardening
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v051-preview
  cancel-in-progress: true

jobs:
  build-publish-and-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-media-time-simulator
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: new-media-time-simulator/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build playable preview
        run: npm run build

      - name: Verify relative GitHub Pages artifact
        run: |
          test -f dist/index.html
          grep -Eq '(src|href)="\./assets/' dist/index.html
          test -s dist/index.html

      - name: Publish v0.5.1 preview under /v051/
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          rm -rf /tmp/nmas-pages
          git clone --quiet --branch gh-pages --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/nmas-pages
          rm -rf /tmp/nmas-pages/v051
          mkdir -p /tmp/nmas-pages/v051
          cp -R new-media-time-simulator/dist/. /tmp/nmas-pages/v051/
          touch /tmp/nmas-pages/.nojekyll
          cd /tmp/nmas-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v051 .nojekyll
          if git diff --cached --quiet; then
            echo "Preview already current."
          else
            git commit -m "deploy: update v0.5.1 core hardening preview"
            git push origin gh-pages
          fi

      - name: Strict v0.5.1 verification (non-blocking for preview)
        continue-on-error: true
        run: npm run verify:v05
