name: v0.5.1 Playable Preview

on:
  push:
    branches: [v05.1/core-hardening]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v051-preview
  cancel-in-progress: true

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-media-time-simulator
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: new-media-time-simulator/package-lock.json
      - run: npm ci
      - name: Strict content, state, and build verification
        run: npm run verify:v051
      - name: Install pinned browser test harness
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.60.0
          npx playwright install --with-deps chromium
      - name: Verify first-session behavior on desktop and mobile
        run: npx playwright test -c playwright.v05.config.mjs src/v05/tests/browser/v051-core-loop.spec.mjs src/v05/tests/browser/v051-smoke.spec.mjs
      - name: Verify relative Pages artifact
        run: |
          test -f dist/index.html
          grep -Eq '(src|href)="\./assets/' dist/index.html
          test -s dist/index.html
      - name: Publish the verified preview under /v051/
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          rm -rf /tmp/nmas-pages
          git clone --quiet --branch gh-pages --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/nmas-pages
          rm -rf /tmp/nmas-pages/v051
          mkdir -p /tmp/nmas-pages/v051
          cp -R new-media-time-simulator/dist/. /tmp/nmas-pages/v051/
          touch /tmp/nmas-pages/.nojekyll
          cd /tmp/nmas-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v051 .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "deploy: update verified v0.5.1 playable preview"
            git push origin gh-pages
          fi
